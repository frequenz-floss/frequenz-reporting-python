[build-system]
requires = [
  "setuptools == 82.0.1",
  "setuptools_scm[toml] == 10.0.5",
  "frequenz-repo-config[lib] == 0.17.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "frequenz-reporting-python"
description = "A highlevel interface for the reporting API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "frequenz",
  "python",
  "lib",
  "library",
  "reporting",
  "highlevel",
  "tooling",
  "api",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
requires-python = ">= 3.11, < 4"
dependencies = [
  "typing-extensions >= 4.12.0, < 5",
  "frequenz-client-reporting >= 0.18.0, < 0.20.0",
  "frequenz-client-common >= 0.3.0, < 0.4",
]
dynamic = ["version"]

[[project.authors]]
name = "Frequenz Energy-as-a-Service GmbH"
email = "floss@frequenz.com"

[project.optional-dependencies]
dev-flake8 = [
  "flake8 == 7.3.0",
  "flake8-datetimez == 20.10.0",
  "flake8-docstrings == 1.7.0",
  "flake8-pyproject == 1.2.4", # For reading the flake8 config from pyproject.toml
  "pydoclint == 0.8.3",
  "pydocstyle == 6.3.0",
]
dev-formatting = ["black == 26.3.1", "isort == 8.0.1"]
dev-mkdocs = [
  "Markdown == 3.10.2",
  "black == 26.3.1",
  "mike == 2.2.0",
  "mkdocs-gen-files == 0.6.1",
  "mkdocs-literate-nav == 0.6.3",
  "mkdocs-macros-plugin == 1.5.0",
  "mkdocs-material == 9.7.6",
  "frequenz-repo-config[lib] == 0.17.0",
]
dev-mypy = [
  "mypy == 1.20.0",
  "types-Markdown == 3.10.2.20260408",
  # For checking the noxfile, docs/ script, and tests
  "frequenz-reporting-python[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-noxfile = ["nox == 2026.4.10", "frequenz-repo-config[lib] == 0.17.0"]
dev-pylint = [
  # dev-pytest already defines a dependency to pylint because of the examples
  # For checking the noxfile, docs/ script, and tests
  "frequenz-reporting-python[dev-mkdocs,dev-noxfile,dev-pytest]",
]
dev-pytest = [
  "pytest == 9.0.3",
  "pylint == 4.0.5", # We need this to check for the examples
  "frequenz-repo-config[extra-lint-examples] == 0.17.0",
  "pytest-mock == 3.15.1",
  "pytest-asyncio == 1.3.0",
  "async-solipsism == 0.9",
]
dev = [
  "frequenz-reporting-python[dev-mkdocs,dev-flake8,dev-formatting,dev-mkdocs,dev-mypy,dev-noxfile,dev-pylint,dev-pytest]",
]

[project.urls]
Documentation = "https://frequenz-floss.github.io/frequenz-reporting-python/"
Changelog = "https://github.com/frequenz-floss/frequenz-reporting-python/releases"
Issues = "https://github.com/frequenz-floss/frequenz-reporting-python/issues"
Repository = "https://github.com/frequenz-floss/frequenz-reporting-python"
Support = "https://github.com/frequenz-floss/frequenz-reporting-python/discussions/categories/support"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["benchmarks", "examples", "src", "tests"]

[tool.flake8]
# We give some flexibility to go over 88, there are cases like long URLs or
# code in documenation that have extra indentation. Black will still take care
# of making everything that can be 88 wide, 88 wide.
max-line-length = 100
extend-ignore = [
  "E203", # Whitespace before ':' (conflicts with black)
  "W503", # Line break before binary operator (conflicts with black)
]
# pydoclint options
style = "google"
check-return-types = false
check-yield-types = false
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
allow-init-docstring = true
check-class-attributes = false

[tool.pylint.similarities]
ignore-comments = ['yes']
ignore-docstrings = ['yes']
ignore-imports = ['no']
min-similarity-lines = 40

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
  "too-many-return-statements",
  # disabled because it conflicts with isort
  "wrong-import-order",
  "ungrouped-imports",
  # pylint's unsubscriptable check is buggy and is not needed because
  # it is a type-check, for which we already have mypy.
  "unsubscriptable-object",
  # Checked by mypy
  "no-member",
  "possibly-used-before-assignment",
  "no-name-in-module",
  # Checked by flake8
  "f-string-without-interpolation",
  "line-too-long",
  "missing-function-docstring",
  "redefined-outer-name",
  "unnecessary-lambda-assignment",
  "unused-import",
  "unused-variable",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "pytest-mock"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
# This option disables mypy cache, and it is sometimes useful to enable it if
# you are getting weird intermittent error, or error in the CI but not locally
# (or vice versa). In particular errors saying that type: ignore is not
# used but getting the original ignored error when removing the type: ignore.
# See for example: https://github.com/python/mypy/issues/2960
#no_incremental = true
packages = ["frequenz.reporting"]
strict = true

[[tool.mypy.overrides]]
module = ["mkdocs_macros.*"]
ignore_missing_imports = true

[tool.setuptools_scm]
version_scheme = "post-release"
